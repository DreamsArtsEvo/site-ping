name: keepalive
# GitHub apaga los cron de un repo sin actividad en 60 días: un commit al mes lo evita.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 1 * *"
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .last
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last && git commit -m "keepalive" && git push
